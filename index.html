<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ゲーム感覚で暗記できるクイズアプリ。XP・レベル・ボス戦・間隔反復・試験レイド・図鑑つき。">
<title>暗記クエスト</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8eff5; --card:#ffffff; --ink:#14213d; --ink2:#4b5b78; --line:#14213d; --shadow:#14213d;
  --pri:#2f5bff; --pri-ink:#ffffff; --xp:#ffb703; --xp-ink:#14213d;
  --ok:#178f63; --ok-bg:#d6f2e5; --ng:#d62839; --ng-bg:#fde0e3; --boss:#a3216f; --track:#cfdae6;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1220; --card:#161e33; --ink:#e8eeff; --ink2:#9fb0d0; --line:#8397cc; --shadow:#04070d;
    --pri:#7b96ff; --pri-ink:#0c1220; --xp:#ffc83d; --xp-ink:#0c1220;
    --ok:#4ade9d; --ok-bg:#12382c; --ng:#ff6b7a; --ng-bg:#3d1720; --boss:#f078c4; --track:#26314f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1220; --card:#161e33; --ink:#e8eeff; --ink2:#9fb0d0; --line:#8397cc; --shadow:#04070d;
  --pri:#7b96ff; --pri-ink:#0c1220; --xp:#ffc83d; --xp-ink:#0c1220;
  --ok:#4ade9d; --ok-bg:#12382c; --ng:#ff6b7a; --ng-bg:#3d1720; --boss:#f078c4; --track:#26314f;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  font-weight:500;font-size:15px;line-height:1.6;
}
.px{font-family:"DotGothic16","Zen Maru Gothic","Hiragino Sans","Noto Sans JP",monospace;font-weight:400;letter-spacing:.02em}
#app{max-width:520px;margin:0 auto;padding:14px 14px 104px}
#app.nobar{padding-bottom:24px}
h1,h2,h3{margin:0;font-weight:900;line-height:1.3}
h1{font-size:22px}
h2{font-size:17px}
h3{font-size:15px;margin:22px 0 10px}
p{margin:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--xp);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 14px}
.win{background:var(--card);border:3px solid var(--line);border-radius:14px;box-shadow:4px 4px 0 var(--shadow);padding:14px;margin-bottom:16px}
.sub{color:var(--ink2);font-size:13px}

.btn{font:inherit;font-weight:900;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:12px;padding:10px 16px;min-height:46px;box-shadow:0 4px 0 var(--shadow);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.btn.pri{background:var(--pri);color:var(--pri-ink)}
.btn.boss{background:var(--boss);color:#fff}
.btn.sm{min-height:38px;padding:6px 12px;font-size:13px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:default;transform:none;box-shadow:0 4px 0 var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1}

.bar{height:16px;border:3px solid var(--line);border-radius:999px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--xp);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar.ok>i{background:var(--ok)}
.bar.boss>i{background:var(--boss)}
.bar.pri>i{background:var(--pri)}

/* status window */
.hero-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.lvbox{background:var(--ink);color:var(--bg);border-radius:10px;padding:6px 10px 4px;text-align:center;min-width:72px;line-height:1}
.lvl{display:block;font-size:12px;opacity:.8}
.lvn{display:block;font-size:44px}
.hero-mid{flex:1;min-width:0}
.rank{font-weight:900;font-size:16px}
.xptxt{color:var(--ink2);font-size:13px}
.xptxt .px{font-size:18px;color:var(--ink)}
.streak{text-align:center;line-height:1.1}
.streak .fire{display:block;font-size:22px}
.streak .sn{font-size:24px}
.streak .sl{display:block;font-size:11px;color:var(--ink2)}
.xpsub{margin-top:6px;font-size:12px;color:var(--ink2);text-align:right}

/* quest */
.qh{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.reward{background:var(--xp);color:var(--xp-ink);border-radius:8px;padding:2px 10px;font-size:14px}
.quest .bar{margin:10px 0 6px}
.qn{text-align:right;font-size:14px;margin-bottom:10px}
.quest.done{border-color:var(--ok)}
.quest.done .reward{background:var(--ok);color:#fff}

.wk{display:flex;gap:8px;align-items:flex-end;height:86px;margin-top:8px}
.wk .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.wk .stick{width:100%;max-width:30px;border:2px solid var(--line);border-radius:6px 6px 2px 2px;background:var(--pri);min-height:4px}
.wk .col.today .stick{background:var(--xp)}
.wk .col span{font-size:11px;color:var(--ink2)}
.wk .col.today span{color:var(--ink);font-weight:900}

/* decks */
.deck-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.deck-h h2{overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chip{font-size:12px;font-weight:700;border:2px solid var(--line);border-radius:8px;padding:0 8px;background:var(--bg)}
.chip.due{background:var(--xp);color:var(--xp-ink);border-color:var(--xp)}
.deck .bar{height:12px;margin-bottom:12px}

.empty{text-align:center;padding:22px 14px}
.empty p{margin-bottom:12px}
.note{border:2px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:16px;background:var(--card)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:3px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
.tabs .in{display:flex;max-width:520px;margin:0 auto}
.tabs button{flex:1;background:none;border:0;font:inherit;font-weight:700;font-size:11px;color:var(--ink2);padding:2px 0;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.tabs .ic{width:48px;height:28px;display:grid;place-items:center;font-size:18px;border-radius:12px}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:900}
.tabs button[aria-current="page"] .ic{background:var(--xp)}

/* forms */
label{display:block;font-weight:900;font-size:13px;margin:0 0 4px}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:3px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:12px}
textarea{resize:vertical;min-height:170px;line-height:1.5}
.msg{border:3px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:14px;font-weight:700}
.msg.ok{border-color:var(--ok);background:var(--ok-bg)}
.msg.ng{border-color:var(--ng);background:var(--ng-bg)}
.msg ul{margin:6px 0 0;padding-left:18px;font-weight:500;font-size:13px}
.hint code{font-family:"DotGothic16",monospace;background:var(--bg);border-radius:4px;padding:0 4px}
.dk{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:2px solid var(--track)}
.dk:first-of-type{border-top:0}
.dk .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:700}
.dk .ct{color:var(--ink2);font-size:12px}

.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.seg button{flex:1;min-width:56px;font:inherit;font-weight:700;font-size:14px;padding:8px 10px;min-height:42px;border:3px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* badges */
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bgrid .win{margin:0;padding:12px;text-align:center}
.bgrid .ico{font-size:34px;line-height:1.2}
.bgrid .bn{font-weight:900;font-size:14px}
.bgrid .bd{font-size:12px;color:var(--ink2)}
.bgrid .lock{opacity:.5;box-shadow:none;border-style:dashed}
.bgrid .lock .ico{filter:grayscale(1)}
.bgrid .when{font-size:11px;color:var(--ok);font-weight:700;margin-top:2px}

/* quiz */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.qprog{font-size:18px}
.qtop .combo{margin-left:auto;font-size:16px;color:var(--boss)}
.ask{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--ng-bg);border-color:var(--ng)}
.ask p{flex:1;min-width:140px;font-weight:700}
.bosswin{display:flex;gap:12px;align-items:center;border-color:var(--boss)}
.sprite{font-size:52px;line-height:1;width:72px;text-align:center;flex:none}
.sprite.hit{animation:shake .45s}
.bossinfo{flex:1;min-width:0}
.bossinfo .nm{font-size:15px;margin-bottom:6px;overflow-wrap:anywhere}
.hearts{font-size:20px;letter-spacing:2px;margin-top:8px}
.hearts.hurt{animation:shake .45s}
.qcard{margin-top:4px}
.qtag{display:inline-block;background:var(--pri);color:var(--pri-ink);font-size:12px;font-weight:900;border-radius:8px;padding:0 8px;margin-bottom:6px}
.qtext{font-size:17px;font-weight:700;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;font-weight:700;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:12px;padding:11px 12px;min-height:52px;box-shadow:0 4px 0 var(--shadow);margin-bottom:12px;cursor:pointer}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.choice .ltr{flex:none;width:30px;height:30px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-family:"DotGothic16",monospace;font-weight:400;font-size:16px}
.choice .tx{flex:1;white-space:pre-wrap;overflow-wrap:anywhere;padding-top:2px}
.choice .mk{flex:none;font-size:18px;padding-top:1px}
.choice.sel{background:var(--pri);color:var(--pri-ink)}
.choice.sel .ltr{border-color:currentColor}
.choice.locked{pointer-events:none;box-shadow:0 4px 0 var(--shadow)}
.choice.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ink)}
.choice.ng{background:var(--ng-bg);border-color:var(--ng);color:var(--ink)}
.actionbar{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center}
.actionbar .fb{flex:1;min-width:0;border:3px solid var(--line);border-radius:12px;padding:6px 10px;font-weight:900;line-height:1.35;font-size:14px}
.actionbar .fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.actionbar .fb.ng{background:var(--ng-bg);border-color:var(--ng)}
.xpchip{display:inline-block;background:var(--xp);color:var(--xp-ink);border-radius:8px;padding:0 8px;margin-left:6px;font-size:13px;animation:pop .45s}
.actionbar .btn{flex:none}
.actionbar .btn.grow{flex:1}

/* result */
.res-h{text-align:center}
.res-h .big{font-size:56px;line-height:1.1}
.res-h h1{margin:6px 0 4px}
.stat{display:flex;gap:10px;margin:14px 0}
.stat>div{flex:1;text-align:center;border:3px solid var(--line);border-radius:12px;padding:8px 4px;background:var(--bg)}
.stat .n{font-size:26px;display:block;line-height:1.2}
.stat .l{font-size:12px;color:var(--ink2)}
.levelup{background:var(--xp);color:var(--xp-ink);border-color:var(--line);text-align:center;animation:pop .5s}
.levelup .px{font-size:26px;display:block}
.newb{display:flex;gap:10px;align-items:center;padding:6px 0}
.newb .ico{font-size:30px}
.miss{border-top:2px solid var(--track);padding:10px 0}
.miss:first-of-type{border-top:0}
.miss .mq{font-weight:700;white-space:pre-wrap;overflow-wrap:anywhere}
.miss .ma{font-size:13px;color:var(--ok);font-weight:700;white-space:pre-wrap;overflow-wrap:anywhere}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px) rotate(-4deg)}40%{transform:translateX(8px) rotate(4deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}

/* ===== v2 追加分 ===== */
.tabs button{font-size:10px}
.tabs .ic{width:44px}
.ttl-now{font-size:12px;font-weight:900;color:var(--boss);line-height:1.3}
.frz{display:block;font-size:11px;color:var(--ink2);margin-top:2px}
.raid{border-color:var(--boss)}
.raid .deck-h .px{color:var(--boss);font-size:15px}
.dk{display:block}
.dkt{display:flex;align-items:center;gap:10px}
.dkt .nm{flex:1;min-width:0}
.dkx label{margin-top:8px}
.dt{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:3px solid var(--line);border-radius:10px;padding:8px 11px;margin-bottom:6px}

.dbl{background:var(--xp);color:var(--xp-ink);border:3px solid var(--line);border-radius:10px;padding:2px 10px;margin-bottom:12px;text-align:center;font-size:15px;animation:pop .5s}
.trait{display:inline-block;background:var(--boss);color:#fff;border-radius:8px;padding:0 8px;font-size:12px;font-family:"Zen Maru Gothic",sans-serif;font-weight:900;margin-right:6px}
.tdesc{font-size:12px;color:var(--ink2);margin-top:6px}
.tbar{position:relative;height:24px;border:3px solid var(--line);border-radius:999px;background:var(--track);overflow:hidden;margin-bottom:14px}
.tbar i{display:block;height:100%;background:var(--ng);transition:width .1s linear}
.tbar span{position:absolute;right:10px;top:-1px;font-size:14px;color:var(--ink);line-height:18px}
.sprite.awake{filter:hue-rotate(140deg) saturate(1.6) drop-shadow(0 0 6px var(--boss))}
.chest{display:flex;gap:12px;align-items:center;border-color:var(--xp);animation:pop .5s;font-weight:900;margin-bottom:14px}
.chest .ico{font-size:32px}
.evt{display:flex;gap:10px;align-items:center;padding:5px 0}
.evt .ico{font-size:24px}

.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.dexg{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin:12px 0}
.tile{font-family:"DotGothic16","Zen Maru Gothic",monospace;font-size:14px;height:40px;border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer;padding:0}
.tile.lk{background:var(--track);color:var(--ink2);border-style:dashed}
.tile.sn{background:var(--pri);color:var(--pri-ink)}
.tile.ms{background:var(--xp);color:var(--xp-ink)}
.tile.on{outline:3px solid var(--ink);outline-offset:1px}
.dexd{border:2px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:4px}
.dexd .mq{font-weight:700;white-space:pre-wrap;overflow-wrap:anywhere}
.dexd .ma{color:var(--ok);font-weight:700;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;margin-top:4px}
.dexd .chips{margin:8px 0 0}

.ttls{display:flex;flex-wrap:wrap;gap:8px}
.ttl{font:inherit;font-weight:700;font-size:13px;padding:6px 12px;border:3px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer}
.ttl[aria-pressed="true"]{background:var(--xp);color:var(--xp-ink)}
.ttl.lk{border-style:dashed;color:var(--ink2);opacity:.6;cursor:default}

.rg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.rg>div{border:3px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;background:var(--card)}
.rg>div:last-child:nth-child(odd){grid-column:1 / -1}
.rg .n{font-size:26px;display:block;line-height:1.2}
.rg .l{font-size:12px;color:var(--ink2);display:block}
.rg .d{font-size:12px;font-weight:900;display:block}
.rg .up{color:var(--ok)}
.rg .dn{color:var(--ng)}
.wk .col .cnt{font-size:12px;color:var(--ink)}
.dr{margin-top:12px}
.dr .deck-h{margin-bottom:4px}
.dr .bar{height:12px}
.mgmt{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:12px}
.dk .mgmt{justify-content:flex-start;margin-top:8px}
</style>
</head>
<body>
<div id="app"></div>
<noscript>このアプリの利用にはJavaScriptを有効にしてください。</noscript>
<script>
/*!
 * GameCore — 暗記クイズ用のゲーム層（DOM非依存・単体で使えます）
 *
 * 使い方（どのクイズアプリにも移植できます）:
 *   var p = GameCore.newProfile();            // 進捗データを作る（保存は呼び出し側で）
 *   GameCore.touchDay(p, 'YYYY-MM-DD');       // 回答のたびに呼ぶ。連続日数とフリーズを更新
 *   GameCore.grade(question, isCorrect, today); // 間隔反復（question.box / due / seen / wrong を更新）
 *   GameCore.addXp(p, today, 10);             // XP加算
 *   var newBadges = GameCore.check(p, today); // 新しく取れたバッジの配列
 *   GameCore.levelOf(p.xp);                   // レベル
 *
 * 主な公開項目: newProfile, day, touchDay, curStreak, addXp, grade, deckProgress, check,
 *   levelOf, base, rankOf, daysBetween, BADGES, RARE_TITLES, INTERVALS, MASTER
 */
(function(global){
  'use strict';

  function pad(n){ return String(n).padStart(2, '0'); }
  function fmtDate(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function addDays(s, n){ var a = s.split('-').map(Number); return fmtDate(new Date(a[0], a[1] - 1, a[2] + n)); }

  var INTERVALS = [0, 1, 3, 7, 14, 30];           // 箱0〜5の復習間隔（日）
  var MASTER = 3;                                  // 箱3以上を「習得」とみなす
  var RANKS = [[1,'研修前夜'],[3,'ポリクリ見習い'],[5,'初期研修医'],[8,'後期研修医'],[12,'専攻医'],[16,'専門医'],[20,'指導医'],[26,'名医']];
  var RARE_TITLES = [
    { id:'t1', name:'歩く解剖学書' }, { id:'t2', name:'鬼の記憶力' }, { id:'t3', name:'深夜の暗記王' }, { id:'t4', name:'ミスを恐れぬ者' },
    { id:'t5', name:'復習の鬼' }, { id:'t6', name:'試験前夜の覇者' }, { id:'t7', name:'伝説の暗記職人' }, { id:'t8', name:'白衣の勇者' }
  ];

  function levelOf(xp){ return Math.floor(Math.sqrt(Math.max(0, xp) / 50)) + 1; }
  function base(L){ return 50 * (L - 1) * (L - 1); }
  function rankOf(L){ var r = RANKS[0][1]; RANKS.forEach(function(x){ if (L >= x[0]) r = x[1]; }); return r; }
  function daysBetween(a, b){
    var x = a.split('-').map(Number), y = b.split('-').map(Number);
    return Math.round((Date.UTC(y[0], y[1] - 1, y[2]) - Date.UTC(x[0], x[1] - 1, x[2])) / 86400000);
  }

  function newProfile(){
    return { xp:0, answered:0, correct:0, streak:0, bestStreak:0, lastDay:null, bestCombo:0,
             bosses:0, perfects:0, questDays:0, revenge:0, daily:{}, badges:{},
             freezes:1, freezeUsed:0, titles:{}, title:null, raids:0, completes:0, chests:0, pbs:0, revOk:0, twoPhase:0 };
  }

function parseBulk(text){

    if (last === 'q') cur.q += '\n' + line;

  });

    if (r.ans === null || !r.ans.trim()){ errors.push(label + '：Answer: の行がありません'); return; }

    items.push({ q:r.q.trim(), choices:r.ch.map(function(c){ return c.trim(); }), answer:ai });
  });

}

    if (un.length){ var pick = un[Math.floor(Math.random() * un.length)]; p.titles[pick.id] = t; ev = { icon:'👑', text:'宝箱：レア称号「' + pick.name + '」を入手！' }; }
  }
  if (!ev && r < 0.30 && (p.freezes || 0) < 3){ p.freezes = (p.freezes || 0) + 1; ev = { icon:'🧊', text:'宝箱：ストリークフリーズを入手（所持' + p.freezes + '）' }; }
  if (!ev){ var xp = 20 + Math.floor(Math.random() * 41); GameCore.addXp(p, t, xp); ev = { icon:'🪙', text:'宝箱：+' + xp + ' XP' }; }
  p.chests++; S.chestNow = ev; S.events.push(ev);
}

function answer(timedOut){
  if (!S || S.answered) return;
  var it = cur(), q = it.q, vm = it.vm, p = state.profile, t = todayStr();
  var sel = Array.from(S.sel).sort(function(a, b){ return a - b; });
  var ok = sel.length === vm.answer.length && sel.every(function(v, i){ return v === vm.answer[i]; });
  var tr = GameCore.touchDay(p, t);
  if (tr.used) S.events.push({ icon:'🧊', text:'ストリークフリーズを' + tr.used + '個使って連続日数を守りました' });
  if (tr.granted) S.events.push({ icon:'🧊', text:'連続' + p.streak + '日ボーナス：フリーズ+1' });
  var dd = GameCore.day(p, t), gain, wasRevenge = (q.wrong || 0) > 0 && q.box === 0, wasMast = q.box >= MASTER;
  p.answered++; dd.n++; S.answeredN++; S.answered = true; S.timedOut = !!timedOut;
  GameCore.grade(q, ok, t);
  if (!wasMast && q.box >= MASTER) dd.mast = (dd.mast || 0) + 1;
  if (ok){
    p.correct++; dd.c++; S.correct++; S.combo++;
    p.bestCombo = Math.max(p.bestCombo, S.combo); S.bestCombo = Math.max(S.bestCombo, S.combo);
    gain = 10 + Math.min(S.combo, 10) + (it.fmt === 'reverse' ? 2 : 0);
    if (it.fmt === 'reverse') p.revOk++;
    if (wasRevenge) p.revenge++;
    if (S.mode === 'boss'){
      var before = S.bossHp, dmg = Math.ceil(S.bossMax / (S.queue.length * S.need)) * (S.combo >= 5 ? 1.5 : 1);
      S.bossHp = Math.max(0, S.bossHp - dmg);
      if (S.trait.phases === 2 && before > 100 && S.bossHp <= 100 && S.bossHp > 0) S.awakeNow = true;
    }
    if (Math.random() < 0.07) openChest();
  } else {
    gain = 2; S.combo = 0;
    if (S.mode === 'boss') S.hearts--;
    if (S.mode === 'time') S.penalty += 5;
    S.missed.push({ q:q.q, ans:q.answer.map(function(i){ return LTR(i) + ') ' + q.choices[i]; }).join('\n') });
  }
  gain *= S.xpMul;
  GameCore.addXp(p, t, gain);
  if (!dd.quest && dd.n >= state.settings.goal){ dd.quest = true; p.questDays++; GameCore.addXp(p, t, 30); S.questDone = true; }

  var deck = deckById(it.deckId);
  if (deck && !wasMast && q.box >= MASTER && deck.questions.every(function(x){ return x.box >= MASTER; })){
    if (deck.questions.length >= 5 && !deck.completeDone){
      deck.completeDone = true; p.completes++; GameCore.addXp(p, t, 60);
      S.events.push({ icon:'📖', text:'図鑑コンプリート「' + deck.name + '」 +60 XP' });
    }
    if (deck.exam && !deck.raidDone && !deck.archived && t <= deck.exam){
      deck.raidDone = true; p.raids++; GameCore.addXp(p, t, 100);
      S.events.push({ icon:'🐲', text:'試験レイドボス討伐「' + deck.name + '」 +100 XP' });
    }
  }
  S.newBadges = S.newBadges.concat(GameCore.check(p, t));
  S.lastGain = gain; S.lastOk = ok; S.fx = ok ? 'hit' : 'hurt';
  save(); render();
}

function nextQ(){
  var over = S.mode === 'boss' && (S.bossHp <= 0 || S.hearts <= 0);
  if (over || S.i >= S.queue.length - 1){ finish(); return; }
  S.i++; beginQ(); window.scrollTo(0, 0); render();
}

function finish(){
  stopTick();
  var p = state.profile, t = todayStr(), bonus = 0;
  if (S.mode === 'boss'){
    if (S.bossHp <= 0){ S.outcome = 'win'; p.bosses++; bonus += S.trait.bonus; if (S.trait.phases === 2) p.twoPhase++; }
    else if (S.hearts <= 0) S.outcome = 'lose';
    else S.outcome = 'escape';
  } else {
    S.outcome = 'done'; bonus += 20;
    if (S.mode === 'time'){
      S.rawSec = Math.round((Date.now() - S.t0) / 100) / 10;
      S.finalSec = Math.round(elapsed() * 10) / 10;
      var deck = S.deckIds && S.deckIds.length === 1 ? deckById(S.deckIds[0]) : null;
      if (deck){
        deck.best = deck.best || {};
        var key = String(S.queue.length), prev = deck.best[key];
        S.prevBest = prev || null;
        if (!prev || S.finalSec < prev){ deck.best[key] = S.finalSec; p.pbs++; S.newPB = true; bonus += prev ? 40 : 20; }
      }
    }
  }
  if (S.missed.length === 0 && S.answeredN >= 5 && S.outcome !== 'lose'){ p.perfects++; bonus += 30; S.perfect = true; }
  GameCore.addXp(p, t, bonus); S.bonus = bonus;
  S.newBadges = S.newBadges.concat(GameCore.check(p, t));
  S.gain = p.xp - S.startXp;
  view = 'result'; save(); window.scrollTo(0, 0); render();
}

function bar(cls, from, to){
  from = Math.max(0, Math.min(100, from)); to = Math.max(0, Math.min(100, to));
  return '<div class="bar ' + cls + '"><i style="width:' + from + '%" data-w="' + to + '"></i></div>';
}
function tabs(){
  var T = [['home','🏠','ホーム'], ['dex','📖','図鑑'], ['add','➕','追加'], ['badges','🏅','バッジ'], ['settings','⚙️','設定']];
  return '<nav class="tabs" aria-label="メニュー"><div class="in">' + T.map(function(x){
    var on = view === x[0] || (x[0] === 'home' && view === 'report');
    return '<button data-act="tab" data-tab="' + x[0] + '"' + (on ? ' aria-current="page"' : '') + '><span class="ic">' + x[1] + '</span>' + x[2] + '</button>';
  }).join('') + '</div></nav>';
}
function weekStats(p, t, off){
  var n = 0, c = 0, xp = 0, days = 0, mast = 0, k;
  for (k = 0; k < 7; k++){
    var d = p.daily[addDays(t, -(k + 7 * off))];
    if (d){ n += d.n; c += d.c; xp += d.xp; mast += d.mast || 0; if (d.n > 0) days++; }
  }
  return { n:n, c:c, xp:xp, days:days, mast:mast, acc:n ? Math.round(c / n * 100) : null };
}
function delta(cur, prev, unit){
  if (cur === null || prev === null) return '';
  var d = cur - prev;
  if (d > 0) return '<span class="d up">先週比 ▲' + d + unit + '</span>';
  if (d < 0) return '<span class="d dn">先週比 ▼' + (-d) + unit + '</span>';
  return '<span class="d">先週と同じ</span>';
}

function viewReport(){
  var p = state.profile, t = todayStr(), a = weekStats(p, t, 0), b = weekStats(p, t, 1), k;
  var h = '<header class="top"><h1>週間レポート</h1><button class="btn sm" data-act="tab" data-tab="home">ホームへ</button></header>';
  var line;
  if (!a.n) line = '直近7日間の回答はまだありません。まずは1問から始めましょう。';
  else {
    line = '直近7日間で' + a.n + '問に回答し、正答率は' + a.acc + '%でした。';
    if (b.n) line += a.n >= b.n ? '前の週より' + (a.n - b.n) + '問多いペースです。' : '前の週より' + (b.n - a.n) + '問少なめでした。';
    if (a.days >= 5) line += '学習日数は' + a.days + '日で、リズムができています。';
  }
  h += '<section class="win"><p>' + esc(line) + '</p></section>';
  h += '<div class="rg">' +
    '<div><span class="n px">' + a.n + '</span><span class="l">回答数</span>' + delta(a.n, b.n, '問') + '</div>' +
    '<div><span class="n px">' + (a.acc === null ? '—' : a.acc + '%') + '</span><span class="l">正答率</span>' + delta(a.acc, b.acc, 'pt') + '</div>' +
    '<div><span class="n px">' + a.xp + '</span><span class="l">獲得XP</span>' + delta(a.xp, b.xp, '') + '</div>' +

  var days = [];
  for (k = 6; k >= 0; k--){
    var s = addDays(t, -k), ar = s.split('-').map(Number), d = p.daily[s] || { n:0, c:0 };
    days.push({ n:d.n, c:d.c, lab:'日月火水木金土'.charAt(new Date(ar[0], ar[1] - 1, ar[2]).getDay()), today:k === 0 });
  }
  var mx = Math.max.apply(null, [1].concat(days.map(function(x){ return x.n; })));
  h += '<section class="win"><h2>日ごとの回答数</h2><div class="wk" style="height:110px">' + days.map(function(x){
    return '<div class="col' + (x.today ? ' today' : '') + '"><span class="cnt px">' + x.n + '</span><div class="stick" style="height:' + Math.round(x.n / mx * 62) + 'px"></div><span>' + x.lab + '</span></div>';
  }).join('') + '</div></section>';

  var weak = [];
  state.decks.forEach(function(d){ if (d.archived) return; d.questions.forEach(function(q){ if (q.wrong > 0) weak.push({ q:q, deck:d.name }); }); });
  weak.sort(function(x, y){ return (y.q.wrong - x.q.wrong) || (x.q.box - y.q.box); });
  h += '<section class="win"><h2>苦手ランキング</h2>';
  if (!weak.length) h += '<p class="sub" style="margin-top:6px">まだ間違えた問題がありません。</p>';
  weak.slice(0, 5).forEach(function(x, i){
    h += '<div class="miss"><div class="mq">' + (i + 1) + '. ' + esc(x.q.q) + '</div><div class="ct sub">' + esc(x.deck) + '　誤答 ' + x.q.wrong + '回　習熟 ' + Math.min(x.q.box, MASTER) + ' / ' + MASTER + '</div></div>';
  });
  h += '</section>';

  var ranks = state.decks.filter(function(d){ return d.questions.length && !d.archived; }).map(function(d){ return { name:d.name, v:Math.round(GameCore.deckProgress(d) * 100) }; })
    .sort(function(x, y){ return x.v - y.v; });
  h += '<section class="win"><h2>デッキ別の習熟度（低い順）</h2>';
  if (!ranks.length) h += '<p class="sub" style="margin-top:6px">デッキがありません。</p>';
  ranks.forEach(function(x){
    h += '<div class="dr"><div class="deck-h"><span>' + esc(x.name) + '</span><span class="px">' + x.v + '%</span></div>' + bar('pri', 0, x.v) + '</div>';
  });
  return h + '</section>';
}

function hpDisp(){ return S.trait.phases === 2 ? (S.bossHp > 100 ? S.bossHp - 100 : S.bossHp) : S.bossHp; }

      '<div class="hearts' + (S.fx === 'hurt' ? ' hurt' : '') + '" aria-label="残りハート ' + hpn + '">' + '❤️'.repeat(hpn) + '🖤'.repeat(S.heartsMax - hpn) + '</div></div></div>';
    if (S.trait.timer && !S.answered){
      var rem = S.tEnd ? Math.max(0, S.tEnd - Date.now()) : S.trait.timer * 1000;

    }

  if (S.answered && S.chestNow) h += '<div class="win chest"><span class="ico">' + S.chestNow.icon + '</span><div>' + esc(S.chestNow.text) + '</div></div>';

  h += '<section class="win qcard">' + (vm.tag ? '<span class="qtag">' + esc(vm.tag) + '</span><br>' : '') + '<div class="qtext">' + esc(vm.text) + '</div></section>';
  S.order.forEach(function(idx, pos){
    var cls = 'choice', isSel = S.sel.has(idx), isAns = vm.answer.indexOf(idx) >= 0, mk = '';
    if (!S.answered){ if (isSel) cls += ' sel'; }
    else { cls += ' locked'; if (isAns){ cls += ' ok'; mk = '✓'; } else if (isSel){ cls += ' ng'; mk = '✗'; } }
    h += '<button class="' + cls + '" data-act="pick" data-i="' + idx + '"' + (S.answered ? ' tabindex="-1"' : '') + '><span class="ltr">' + LTR(pos) + '</span><span class="tx">' + esc(vm.choices[idx]) + '</span><span class="mk">' + mk + '</span></button>';

    else h += '<div class="sub" style="flex:1;text-align:center">選択肢をタップして回答</div>';

    else fbTxt = (S.timedOut ? '時間切れ！　' : '不正解　') + '正解は ' + vm.answer.map(function(i){ return LTR(S.order.indexOf(i)); }).join(', ');

  else if (S.outcome === 'lose'){ icon = '💀'; title = '敗北…'; sub = 'ハートがなくなった。まちがえた問題を見直して再挑戦しよう'; }

    '<div><span class="n px">' + S.bestCombo + '</span><span class="l">最大連続</span></div></div>';
  var bits = [];

  if (S.questDone) bits.push('デイリークエスト達成 +30 XP');

  if (L1 > L0) h += '<section class="win levelup"><span class="px">LEVEL UP!  Lv ' + L0 + ' → Lv ' + L1 + '</span><div>称号：' + esc(GameCore.rankOf(L1)) + '</div></section>';

}

function render(){
  var h = '';
  if (view === 'home') h = viewHome();
  else if (view === 'dex') h = viewDex();
  else if (view === 'add') h = viewAdd();
  else if (view === 'badges') h = viewBadges();
  else if (view === 'report') h = viewReport();
  else if (view === 'settings') h = viewSettings();
  else if (view === 'quiz') h = viewQuiz();
  else if (view === 'result') h = viewResult();
  var bare = view === 'quiz' || view === 'result';
  var app = document.getElementById('app');
  app.className = bare ? 'nobar' : '';
  app.innerHTML = h + (bare ? '' : tabs());
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    document.querySelectorAll('.bar>i[data-w]').forEach(function(i){ i.style.width = i.getAttribute('data-w') + '%'; });
  }); });
  if (S && S.mode === 'boss') S.shownDisp = Math.round(hpDisp());
}

/* ================================================================
   操作
   ================================================================ */
var A = {
  tab:function(el){ view = el.getAttribute('data-tab'); ui.confirmDel = null; endSession(); window.scrollTo(0, 0); render(); },
  goHome:function(){ view = 'home'; endSession(); window.scrollTo(0, 0); render(); },
  startQuest:function(){ startSession(null, 'normal'); },
  startDeck:function(el){ startSession([el.getAttribute('data-id')], el.getAttribute('data-mode')); },
  retry:function(){ startSession(S.deckIds, S.mode); },
  pick:function(el){
    if (!S || S.answered) return;
    var i = +el.getAttribute('data-i'), it = cur();
    if (it.fmt === 'mcq' && it.vm.answer.length > 1){ if (S.sel.has(i)) S.sel.delete(i); else S.sel.add(i); render(); }
    else { S.sel = new Set([i]); answer(); }
  },
  submit:function(){ if (S && !S.answered && S.sel.size) answer(); },
  next:function(){ nextQ(); },
  quit:function(){ S.quitAsk = true; render(); },
  quitNo:function(){ S.quitAsk = false; render(); },
  quitYes:function(){ view = 'home'; endSession(); window.scrollTo(0, 0); render(); },

  dexSel:function(el){
    var key = el.getAttribute('data-d') + '|' + el.getAttribute('data-q');
    ui.dexSel = ui.dexSel === key ? null : key; render();
  },
  equip:function(el){ var p = state.profile, id = el.getAttribute('data-id'); p.title = p.title === id ? null : id; save(); render(); },

  fillSample:function(){ ui.importText = FORMAT_EXAMPLE; ui.importMsg = null; render(); },
  doImportQ:function(){
    var res = parseBulk(ui.importText);
    if (!res.items.length){ ui.importMsg = { ok:false, text:'読み込める問題がありませんでした。書式を確認してください。', errs:res.errors }; render(); return; }
    var name = (ui.importName || '').trim() || '新しいデッキ';
    var r = addDeckFromItems(name, res.items);
    save();
    ui.importMsg = { ok:true, errs:res.errors,
      text:'「' + name + '」に' + r.added + '問を追加しました' + (r.dup ? '（重複' + r.dup + '問はスキップ）' : '') + (r.unarch ? '（アーカイブから戻しました）' : '') + (res.errors.length ? '。形式エラーの' + res.errors.length + '問は除外しました' : '') };
    if (!res.errors.length) ui.importText = '';
    render();
  },
  delDeck:function(el){ ui.confirmDel = el.getAttribute('data-id'); render(); },
  delDeckNo:function(){ ui.confirmDel = null; render(); },
  delDeckYes:function(el){
    var id = el.getAttribute('data-id'), d = deckById(id);
    if (!d) return;
    state.decks = state.decks.filter(function(x){ return x.id !== id; });
    ui.confirmDel = null; ui.dexSel = null; ui.msg = '「' + d.name + '」を削除しました。'; ui.msgKind = 'ok';
    save(); render();
  },
  archive:function(el){
    var d = deckById(el.getAttribute('data-id'));
    if (!d) return;
    d.archived = true; d.archivedAt = todayStr(); ui.confirmDel = null;
    ui.msg = '「' + d.name + '」をアーカイブしました。ホームの「アーカイブ」から復習・復元・削除ができます。'; ui.msgKind = 'ok';
    save(); render();
  },
  unarchive:function(el){
    var d = deckById(el.getAttribute('data-id'));
    if (!d) return;
    d.archived = false; d.archivedAt = null; ui.confirmDel = null;
    ui.msg = '「' + d.name + '」をデッキ一覧に戻しました。'; ui.msgKind = 'ok';
    save(); render();
  },
  archToggle:function(){ ui.archOpen = !ui.archOpen; render(); },

  setN:function(el){ state.settings.n = +el.getAttribute('data-v'); save(); render(); },
  setGoal:function(el){ state.settings.goal = +el.getAttribute('data-v'); save(); render(); },
  setFormats:function(el){ state.settings.formats = el.getAttribute('data-v'); save(); render(); },
  setShuffle:function(el){ state.settings.shuffle = el.getAttribute('data-v') === 'on'; save(); render(); },
  setTheme:function(el){ state.settings.theme = el.getAttribute('data-v'); applyTheme(); save(); render(); },

  exportData:function(){
    ui.exportText = JSON.stringify(state);
    render();
    var ta = document.getElementById('ex');
    function fallback(){ try { ta.focus(); ta.select(); document.execCommand('copy'); } catch (e) {} }
    try { navigator.clipboard.writeText(ui.exportText).catch(fallback); } catch (e) { fallback(); }
  },
  restore:function(){
    try {
      var o = JSON.parse(ui.restoreText);
      if (!o || !Array.isArray(o.decks) || !o.profile) throw new Error('bad');
      ui.restoreStage = true; ui.restoreMsg = { ok:true, text:'読み込めます（デッキ' + o.decks.length + '件、' + (o.profile.xp || 0) + ' XP）。置き換えてよければ下のボタンを押してください。' };
    } catch (e) { ui.restoreStage = false; ui.restoreMsg = { ok:false, text:'書き出したテキストの全体を貼り付けてください（{ から } まで）。' }; }
    render();
  },
  restoreNo:function(){ ui.restoreStage = false; ui.restoreMsg = null; render(); },
  restoreYes:function(){
    try {
      state = normalize(JSON.parse(ui.restoreText)); state.seeded = true; save(); applyTheme();
      ui.restoreStage = false; ui.restoreText = ''; ui.restoreMsg = { ok:true, text:'読み込みました。' };
    } catch (e) { ui.restoreMsg = { ok:false, text:'読み込みに失敗しました。' }; }
    render();
  },
  wipe:function(){ ui.wipeAsk = true; render(); },
  wipeNo:function(){ ui.wipeAsk = false; render(); },
  wipeYes:function(){
    state = defaultState(); state.seeded = true; save(); applyTheme();
    ui.wipeAsk = false; ui.exportText = ''; ui.homeShown = false; ui.dexSel = null; view = 'home'; render();
  }
};

document.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  var fn = A[el.getAttribute('data-act')];
  if (fn) fn(el);
});
document.addEventListener('input', function(e){
  var b = e.target.getAttribute && e.target.getAttribute('data-bind');
  if (b) ui[b] = e.target.value;
});
document.addEventListener('change', function(e){
  var id = e.target.getAttribute && e.target.getAttribute('data-exam');
  if (!id) return;
  var d = deckById(id);
  if (d){
    d.exam = e.target.value || null;
    /* すでに全問習得済みの状態で日付を入れた場合は、報酬なしで「討伐済み」扱いにする（日付の付け替えでXPを稼げないように） */
    d.raidDone = !!d.exam && d.questions.length > 0 && d.questions.every(function(x){ return x.box >= MASTER; });
    save(); render();
  }
});

applyTheme();
render();
})();
</script>
</body>
</html>
